    <!-- Filter benign Vite websocket disconnection logs in sandboxed dev environment -->
    <script>
      (function () {
        // Intercept Vite development WebSockets to prevent connection refused errors in sandboxed containers
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            var urlStr = String(url || '');
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            var isViteSocket =
              urlStr.indexOf('24678') !== -1 ||
              urlStr.indexOf('token=') !== -1 ||
              urlStr.indexOf('@vite') !== -1 ||
              protoStr.indexOf('vite-hmr') !== -1 ||
              protoStr.indexOf('vite-ping') !== -1;

            if (isViteSocket) {
              var listeners = {};
              var self = {
                url: urlStr,
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || ''),
                readyState: 0,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function (type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open' && self.readyState === 1) {
                    setTimeout(function () {
                      try { fn({ type: 'open', target: self }); } catch (_) {}
                    }, 0);
                  }
                },
                removeEventListener: function (type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function (f) { return f !== fn; });
                  }
                },
                dispatchEvent: function (evt) {
                  var type = evt && evt.type;
                  if (type && listeners[type]) {
                    listeners[type].forEach(function (fn) {
                      try { fn(evt); } catch (_) {}
                    });
                  }
                  return true;
                },
                send: function () {},
                close: function () {
                  self.readyState = 3;
                  if (self.onclose) {
                    try { self.onclose({ type: 'close', wasClean: true, code: 1000, target: self }); } catch (_) {}
                  }
                  if (listeners['close']) {
                    listeners['close'].forEach(function (fn) {
                      try { fn({ type: 'close', wasClean: true, code: 1000, target: self }); } catch (_) {}
                    });
                  }
                }
              };

              setTimeout(function () {
                self.readyState = 1;
                var openEvt = { type: 'open', target: self };
                if (self.onopen) {
                  try { self.onopen(openEvt); } catch (_) {}
                }
                if (listeners['open']) {
                  listeners['open'].forEach(function (fn) {
                    try { fn(openEvt); } catch (_) {}
                  });
                }
              }, 0);

              return self;
            }

            try {
              if (typeof Reflect !== 'undefined' && Reflect.construct) {
                return Reflect.construct(NativeWebSocket, arguments);
              }
              return new (Function.prototype.bind.apply(NativeWebSocket, [null].concat(Array.prototype.slice.call(arguments))))();
            } catch (_) {
              return new NativeWebSocket(url, protocols);
            }
          };

          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        // Prevent window.alert from throwing in sandboxed iframes
        if (typeof window !== 'undefined' && window.top !== window.self) {
          window.alert = function (msg) {
            console.warn('[WikiZero Alert in sandbox]:', msg);
          };
        }

        var isViteNotice = function (msg) {
          if (!msg) return false;
          var s = '';
          try {
            s = typeof msg === 'string' ? msg : (msg && msg.message) ? msg.message : (msg && msg.stack) ? msg.stack : JSON.stringify(msg);
          } catch (_) {
            s = String(msg);
          }
          var lower = s.toLowerCase();
          return (
            lower.indexOf('[vite]') !== -1 ||
            lower.indexOf('vite:') !== -1 ||
            lower.indexOf('failed to connect to websocket') !== -1 ||
            lower.indexOf('websocket connection to') !== -1 ||
            lower.indexOf('connection refused') !== -1 ||
            lower.indexOf('vite-hmr') !== -1 ||
            lower.indexOf('vite-ping') !== -1
          );
        };
        var filterArgs = function (args) {
          for (var i = 0; i < args.length; i++) {
            if (isViteNotice(args[i])) return true;
          }
          return false;
        };
        var origError = console.error;
        var origWarn = console.warn;
        var origLog = console.log;
        var origInfo = console.info;
        var origDebug = console.debug;
        console.error = function () {
          if (filterArgs(arguments)) return;
          origError.apply(console, arguments);
        };
        console.warn = function () {
          if (filterArgs(arguments)) return;
          origWarn.apply(console, arguments);
        };
        console.log = function () {
          if (filterArgs(arguments)) return;
          origLog.apply(console, arguments);
        };
        console.info = function () {
          if (filterArgs(arguments)) return;
          origInfo.apply(console, arguments);
        };
        console.debug = function () {
          if (filterArgs(arguments)) return;
          origDebug.apply(console, arguments);
        };
        window.addEventListener(
          'error',
          function (e) {
            if (e && (isViteNotice(e.message) || isViteNotice(e.error) || isViteNotice(e.filename))) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (e && (isViteNotice(e.reason) || (e.reason && isViteNotice(e.reason.message)))) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
